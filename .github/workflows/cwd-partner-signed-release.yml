name: CWD Partner - Signed Android APK

# Keep this workflow on testing until the owner explicitly approves
# production backend deployment. No source files or credentials are
# written to main. It is intentionally fail-closed without signing secrets.
on:
  push:
    branches:
      - testing
    paths:
      - 'apps/cwd_vendor_android/**'
      - '.github/workflows/cwd-partner-signed-release.yml'

permissions:
  contents: read

jobs:
  signing-check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - name: Check for owner-controlled release signing material
        id: credentials
        env:
          KEY_B64: ${{ secrets.CWD_PARTNER_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.CWD_PARTNER_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$KEY_B64" && -n "$STORE_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signed release skipped: CWD signing secrets are not configured."
          fi

  signed-apk:
    needs: signing-check
    if: needs.signing-check.outputs.ready == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout testing source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check Android configurator syntax
        run: python3 -m py_compile apps/cwd_vendor_android/scripts/configure_android.py

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Generate Android project and run default tests
        working-directory: apps/cwd_vendor_android
        run: |
          bash scripts/bootstrap.sh
          flutter analyze --no-fatal-infos
          flutter test
          flutter test test/production_release_config_test.dart --dart-define=CWD_PARTNER_PRODUCTION=true

      - name: Inject signing certificate without committing secrets
        working-directory: apps/cwd_vendor_android
        env:
          CWD_PARTNER_KEYSTORE_B64: ${{ secrets.CWD_PARTNER_KEYSTORE_B64 }}
          CWD_PARTNER_KEYSTORE_PASSWORD: ${{ secrets.CWD_PARTNER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$CWD_PARTNER_KEYSTORE_B64" | base64 --decode > android/app/cwd-partner-release.jks
          CWD_PARTNER_RELEASE_BUILD=true python3 scripts/configure_android.py

      - name: Create final, owner-signed Android package
        working-directory: apps/cwd_vendor_android
        env:
          CWD_PARTNER_KEYSTORE_PASSWORD: ${{ secrets.CWD_PARTNER_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --dart-define=CWD_PARTNER_PRODUCTION=true

      - name: Verify Android signing and package identity
        working-directory: apps/cwd_vendor_android
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$signer"
          "$signer" verify --print-certs "$apk"
          echo "CWD Partner APK SHA-256:"
          sha256sum "$apk"

      - name: Upload final APK for owner review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CWD-Partner-Signed-Android-APK
          path: apps/cwd_vendor_android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Public download URL works on Android without GitHub login. Marked
      # prerelease until CWD owner completes live booking tests.
      - name: Publish owner-review APK on GitHub Releases
        working-directory: apps/cwd_vendor_android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=cwd-partner-latest
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/CWD-Partner.apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/CWD-Partner.apk#CWD-Partner.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$RUNNER_TEMP/CWD-Partner.apk#CWD-Partner.apk" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "CWD Partner Android — Owner Review" \
              --notes "Signed CWD Partner APK for owner approval. Do not distribute to vendors until OTP, offer, allocation, trip and earnings checks pass."
          fi
          echo "Owner-review APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/CWD-Partner.apk"
