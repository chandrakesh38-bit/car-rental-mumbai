name: CWD Vendor Android - Testing APK

on:
  push:
    branches:
      - testing
    paths:
      - 'apps/cwd_vendor_android/**'
      - '.github/workflows/cwd-vendor-android-testing.yml'

permissions:
  contents: read

jobs:
  vendor-apk-safe-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout testing branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify existing vendor portal JavaScript
        run: node scripts/test-vendor-booking-html.mjs

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Scaffold internal Android project
        working-directory: apps/cwd_vendor_android
        run: bash scripts/bootstrap.sh

      - name: Flutter analyze
        working-directory: apps/cwd_vendor_android
        run: flutter analyze --no-fatal-infos

      - name: Flutter unit tests
        working-directory: apps/cwd_vendor_android
        run: flutter test

      - name: Build safe-mode debug APK (NO STAGING WRITE ACCESS)
        working-directory: apps/cwd_vendor_android
        run: flutter build apk --debug

      - name: Upload internal testing APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cwd-vendor-android-safe-mode
          path: apps/cwd_vendor_android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
