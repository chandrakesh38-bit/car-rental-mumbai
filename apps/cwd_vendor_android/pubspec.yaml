name: cwd_vendor_android
description: CWD Partner Android app - internal testing build only
publish_to: none
version: 0.6.0+8

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.2.0-beta.3
  flutter_secure_storage: 11.2.0
  permission_handler: 12.0.3
  url_launcher: 6.3.2
  http: 1.5.0
  http_parser: ^4.1.2
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/cwd-logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/cwd-logo.png
