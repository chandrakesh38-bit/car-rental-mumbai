<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CWD Final Invoice</title><style>body{font-family:system-ui;background:#f8fafc;margin:0;color:#0f172a}.w{max-width:620px;margin:auto;padding:16px}.c{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin:12px 0}.r{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #f1f5f9}.pay{display:block;text-align:center;background:#16a34a;color:#fff;padding:15px;border-radius:12px;text-decoration:none;font-weight:900;margin-top:18px}</style></head><body><div class="w"><div class="c"><h2>Car With Driver India</h2><p>Final Customer Invoice</p><div id="x">Loading…</div></div></div><script>const t=new URLSearchParams(location.search).get('t'),x=document.getElementById('x'),m=v=>'₹'+Number(v||0).toLocaleString('en-IN'),e=s=>String(s??'').replace(/[&<>"']/g,'');fetch('/api/customer-invoice?t='+encodeURIComponent(t||'')).then(async r=>{const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Invalid invoice');const i=d.invoice;x.innerHTML='<div class="r"><b>Booking ID</b><span>'+e(i.booking_id)+'</span></div><div class="r"><b>Route</b><span>'+e(i.route||'')+'</span></div><div class="r"><b>Trip date</b><span>'+e(i.trip_date||'')+'</span></div><div class="r"><b>Vehicle</b><span>'+e(i.vehicle||'')+'</span></div><div class="r"><b>Billable KM × rate</b><span>'+e(i.billable_km)+' × '+m(i.customer_km_rate)+'</span></div><div class="r"><b>Driver allowance</b><span>'+m(i.customer_da)+'</span></div><div class="r"><b>Night</b><span>'+m(i.customer_night)+'</span></div><div class="r"><b>Toll</b><span>'+m(i.toll)+'</span></div><div class="r"><b>Parking</b><span>'+m(i.parking)+'</span></div><div class="r"><b>State tax</b><span>'+m(i.state_tax)+'</span></div><div class="r"><b>Other</b><span>'+m(i.approved_other)+'</span></div><div class="r"><b>Total</b><strong>'+m(i.customer_total)+'</strong></div><div class="r"><b>Less advance</b><span>'+m(i.customer_advance)+'</span></div><div class="r"><b>Balance payable</b><strong>'+m(i.customer_balance)+'</strong></div>'+(d.payment_url?'<a class="pay" href="'+d.payment_url+'">PAY NOW</a>':'')}).catch(er=>x.textContent=er.message)</script></body></html>
