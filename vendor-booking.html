<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CWD Vendor Booking</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--navy:#0b1739;--navy2:#17336f;--blue:#1769e0;--green:#0f9f6e;--red:#dc2626;--muted:#64748b;--line:#e3e9f3;color:#0f172a;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbfdff,#f3f6fb);min-height:100vh}.wrap{max-width:680px;margin:auto;padding:14px 12px 40px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 14px}.brand-left{display:flex;align-items:center;gap:10px}.brand img{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:#fff}.brand-name{font-size:16px;font-weight:950;color:var(--navy);letter-spacing:-.02em}.brand-sub{font-size:10px;color:var(--muted);font-weight:700}.secure{font-size:10px;color:#166534;background:#ecfdf3;border:1px solid #bbf7d0;padding:7px 9px;border-radius:999px;font-weight:850}.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:22px;padding:20px;margin-bottom:13px;box-shadow:0 15px 34px rgba(11,23,57,.16)}.hero .eyebrow{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#f1d589;font-weight:900}.hero h1{font-size:23px;margin:5px 0 5px;letter-spacing:-.03em}.hero p{font-size:12px;color:#dbe6ff;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 8px 25px rgba(15,23,42,.05)}.booking-id{font-size:11px;font-weight:900;color:#45607d;background:#f4f7fb;border-radius:999px;padding:6px 9px;display:inline-block}.title{font-size:18px;font-weight:950;color:var(--navy);margin:10px 0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.item{border:1px solid #edf0f5;background:#fbfcfe;border-radius:13px;padding:11px}.item.wide{grid-column:1/-1}.item small{display:block;color:#7a8799;font-size:9px;text-transform:uppercase;font-weight:850;letter-spacing:.04em;margin-bottom:4px}.item b{font-size:12px;color:#17243e;line-height:1.4}.payout{background:linear-gradient(135deg,#edf8f4,#f7fffb);border:1px solid #cfeadd;border-radius:15px;padding:14px;margin-top:12px}.payout small{display:block;color:#527064;font-size:10px;font-weight:800}.payout strong{display:block;color:#087a55;font-size:25px;margin-top:2px;letter-spacing:-.03em}.rules{font-size:11px;color:#566274;line-height:1.55;margin:0;padding-left:18px}.notice{font-size:11px;color:#5b6677;background:#f8fafc;border-radius:12px;padding:11px;margin-top:12px;line-height:1.5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:13px;padding:14px;font-weight:950;font-size:14px;text-decoration:none;cursor:pointer}.accept{background:#0f9f6e;color:white}.decline{background:#fff0f1;color:#c0222f;border:1px solid #ffd4d8}.primary{background:linear-gradient(135deg,var(--navy),#1b3d80);color:white}.secondary{background:#fff;border:1px solid #d7dfea;color:var(--navy)}.success{background:#ecfdf3;border:1px solid #bbf7d0;color:#166534;border-radius:15px;padding:16px;text-align:center}.declined{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:15px;padding:16px;text-align:center}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:850;color:#25324d;margin-bottom:6px}input,select{width:100%;border:1px solid #d4ddea;border-radius:12px;padding:12px 13px;font:inherit;background:#fff;outline:none}input:focus,select:focus{border-color:#6f91d5;box-shadow:0 0 0 3px rgba(23,105,224,.1)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.maps{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;font-weight:850;color:#1769e0;text-decoration:none}.trip-state{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:850;color:#38506d}.dot{width:8px;height:8px;border-radius:50%;background:#16a34a}.muted{color:var(--muted);font-size:11px;line-height:1.5}.locked{font-size:10px;color:#7a8799;background:#f8fafc;border-radius:10px;padding:9px;margin-top:10px}.error{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;border-radius:15px;padding:14px;font-weight:800}@media(max-width:520px){.summary,.row{grid-template-columns:1fr}.item.wide{grid-column:auto}.actions{grid-template-columns:1fr}.secure{display:none}.wrap{padding:10px 10px 32px}.hero{border-radius:19px}.card{border-radius:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-left"><img src="/logo-optimized.webp" alt="Car With Driver India"><div><div class="brand-name">Car With Driver India</div><div class="brand-sub">Vendor Operations</div></div></div>
    <div class="secure">Secure Link</div>
  </div>
  <div class="hero"><div class="eyebrow" id="hero-eyebrow">Vendor Booking</div><h1 id="hero-title">Loading…</h1><p id="hero-sub">Please wait while we open your secure booking link.</p></div>
  <div id="app"></div>
</div>
<script>
const q=new URLSearchParams(location.search),offer=q.get('offer'),allocation=q.get('allocation'),app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const dt=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})};
async function api(path,opt={}){const r=await fetch(path,opt),d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||'Request failed');return d}
function setHero(title,sub,eyebrow){document.getElementById('hero-title').textContent=title;document.getElementById('hero-sub').textContent=sub;document.getElementById('hero-eyebrow').textContent=eyebrow}
async function load(){try{if(!offer&&!allocation)throw new Error('Secure booking token is missing.');const d=await api('/api/vendor-portal?'+(offer?'offer='+encodeURIComponent(offer):'allocation='+encodeURIComponent(allocation)));if(d.mode==='offer')renderOffer(d.offer);else renderAllocation(d)}catch(e){setHero('Unable to open booking','This link may be invalid, expired or revoked.','Secure Link');app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function renderOffer(o){
 setHero('Booking Offer','Review the trip details and respond below. Customer private details are hidden until allocation.','CWD Vendor Offer');
 if(o.status==='accepted'){app.innerHTML='<div class="success"><b>✓ Offer Accepted</b><br><span class="muted">Your response is recorded. This booking is not allocated yet. CWD will contact you if you are selected.</span></div>'+offerSummary(o);return}
 if(o.status==='declined'){app.innerHTML='<div class="declined"><b>Offer Declined</b><br><span class="muted">Your response has been recorded.</span></div>'+offerSummary(o);return}
 if(o.status==='allocated'){app.innerHTML='<div class="success"><b>✓ Booking Allocated</b><br><span class="muted">Please use the separate allocation link shared by CWD to view customer details and operate the trip.</span></div>'+offerSummary(o);return}
 app.innerHTML=offerSummary(o)+'<div class="card"><div class="title">Your Response</div><div class="notice">Accepting this offer only confirms your availability. It does <b>not</b> allocate the booking. CWD may receive acceptance from multiple vendors and will manually allocate one vendor.</div><div class="actions"><button class="btn accept" onclick="respond(\'accepted\')">✓ ACCEPT OFFER</button><button class="btn decline" onclick="respond(\'declined\')">DECLINE</button></div></div>';
}
function offerSummary(o){return '<div class="card"><span class="booking-id">'+esc(o.booking_id)+'</span><div class="title">Booking Summary</div><div class="summary"><div class="item"><small>Vehicle</small><b>'+esc(o.vehicle||'As requested')+'</b></div><div class="item"><small>Trip Type</small><b>'+esc(o.trip_type||'—')+'</b></div><div class="item wide"><small>Route</small><b>'+esc(o.route||'—')+'</b></div><div class="item"><small>Start</small><b>'+esc(dt(o.start_at))+'</b></div><div class="item"><small>Final Drop</small><b>'+esc(dt(o.final_drop_at))+'</b></div><div class="item"><small>Estimated / Billable KM</small><b>'+esc(o.estimated_km||0)+' KM</b></div><div class="item"><small>Duty Days</small><b>'+esc(o.pricing_snapshot?.duty_days||1)+'</b></div></div><div class="payout"><small>Estimated Vendor Payout</small><strong>'+money(o.estimated_vendor_payout)+'</strong></div><div class="title" style="font-size:14px;margin-top:15px">Applicable Vendor Rules</div><ul class="rules"><li>Outstation minimum billing: 240 KM/day.</li><li>Vendor rate: ₹11/km and Driver Allowance: ₹500/day.</li><li>Night: ₹300 only when vehicle is actually driven between 10 PM–6 AM.</li><li>Toll, parking and state tax are actual/as applicable.</li><li>For one-way, customer drop KM + empty return KM are billable; empty return does not add another driver allowance.</li></ul></div>'}
async function respond(response){if(!confirm(response==='accepted'?'Confirm that you are available for this booking?':'Decline this booking offer?'))return;try{await api('/api/vendor-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'respond_offer',offer,response})});await load()}catch(e){alert(e.message)}}
function renderAllocation(d){
 const b=d.booking,a=d.allocation,t=d.trip||{};setHero('Allocated Booking','This booking has been allocated to you. Customer details are now available.','CWD Vendor Trip');
 const maps=x=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x||'');
 app.innerHTML='<div class="card"><span class="booking-id">'+esc(b.booking_id)+'</span><div class="title">Customer & Trip Details</div><div class="summary"><div class="item"><small>Customer</small><b>'+esc(b.customer_name||'—')+'</b></div><div class="item"><small>Mobile</small><b><a href="tel:'+esc(b.customer_mobile)+'" style="color:#1769e0;text-decoration:none">'+esc(b.customer_mobile||'—')+'</a></b></div><div class="item wide"><small>Pickup</small><b>'+esc(b.exact_pickup||'—')+'</b><br><a class="maps" target="_blank" href="'+maps(b.exact_pickup)+'">Open pickup in Google Maps →</a></div><div class="item wide"><small>Final Drop</small><b>'+esc(b.exact_drop||'—')+'</b><br><a class="maps" target="_blank" href="'+maps(b.exact_drop)+'">Open drop in Google Maps →</a></div><div class="item"><small>Pickup Date / Time</small><b>'+esc(dt(b.pickup_date_time))+'</b></div><div class="item"><small>Final Drop</small><b>'+esc(dt(b.final_drop_date_time))+'</b></div><div class="item"><small>Trip Type</small><b>'+esc(b.trip_type||'—')+'</b></div><div class="item"><small>Vehicle</small><b>'+esc(b.vehicle||'—')+'</b></div></div></div>'+
 '<div class="card"><div class="title">Vehicle & Driver</div><div class="field"><label>Vehicle number</label><input id="vn" placeholder="e.g. MH01AB1234" value="'+esc(a.vehicle_number||'')+'"></div><div class="field"><label>Driver name</label><input id="dn" placeholder="Driver full name" value="'+esc(a.driver_name||'')+'"></div><div class="field"><label>Driver mobile</label><input id="dm" inputmode="numeric" maxlength="10" placeholder="10-digit mobile" value="'+esc(a.driver_mobile||'')+'"></div><button class="btn primary" onclick="saveDriver()">Save Vehicle & Driver</button></div>'+
 (!t.started_at?'<div class="card"><div class="trip-state"><span class="dot"></span>Ready to start</div><div class="title">Start Trip</div><p class="muted">At customer pickup, upload the odometer photo and enter the starting reading. Submitted start details are locked for vendor.</p><div class="field"><label>Starting odometer reading *</label><input id="skm" type="number" min="0" step="0.1" placeholder="Enter KM"></div><div class="field"><label>Starting odometer photo *</label><input id="sphoto" type="file" accept="image/*" capture="environment"></div><button class="btn accept" onclick="startTrip()">START TRIP</button></div>':'<div class="card"><div class="trip-state"><span class="dot"></span>Trip started</div><div class="summary"><div class="item"><small>Started At</small><b>'+esc(dt(t.started_at))+'</b></div><div class="item"><small>Starting KM</small><b>'+esc(t.starting_odometer)+'</b></div></div><div class="locked">Starting odometer details are locked. Only CWD admin can correct them.</div></div>')+
 (t.started_at&&!t.ended_at?'<div class="card"><div class="title">End Trip</div><p class="muted">Submit these details at final customer drop.</p><div class="field"><label>Closing odometer reading *</label><input id="ekm" type="number" min="0" step="0.1" placeholder="Enter KM"></div><div class="field"><label>Closing odometer photo *</label><input id="ephoto" type="file" accept="image/*" capture="environment"></div><div class="row"><div class="field"><label>Toll ₹</label><input id="toll" type="number" min="0" value="0"></div><div class="field"><label>Parking ₹</label><input id="parking" type="number" min="0" value="0"></div><div class="field"><label>State Tax ₹</label><input id="tax" type="number" min="0" value="0"></div><div class="field"><label>Night Charge</label><select id="night"><option value="no">No</option><option value="yes">Yes</option></select></div></div><div class="field"><label>Other ₹</label><input id="other" type="number" min="0" value="0"></div><div class="field"><label>Other charge reason</label><input id="reason" placeholder="Required only if Other charge is entered"></div><button class="btn primary" onclick="endTrip()">END TRIP & SUBMIT</button></div>':'')+
 (t.ended_at?'<div class="card"><div class="success"><b>✓ Trip Closure Submitted</b><br><span class="muted">CWD admin review is required.</span></div><div class="summary"><div class="item"><small>Trip KM</small><b>'+esc(t.calculated_trip_km)+'</b></div><div class="item"><small>Review Status</small><b>'+esc(String(t.review_status||'').replaceAll('_',' '))+'</b></div></div><div class="locked">Submitted closing details are locked. CWD admin can review, correct or query the submission.</div></div>':'');
}
async function saveDriver(){try{await api('/api/vendor-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save_driver_vehicle',allocation,vehicle_number:vn.value,driver_name:dn.value,driver_mobile:dm.value})});alert('Vehicle and driver details saved.');await load()}catch(e){alert(e.message)}}
async function startTrip(){if(!skm.value||!sphoto.files[0])return alert('Starting odometer reading and photo are required.');const f=new FormData();f.set('allocation',allocation);f.set('action','start');f.set('odometer',skm.value);f.set('photo',sphoto.files[0]);try{await api('/api/vendor-portal',{method:'POST',body:f});alert('Trip started successfully.');await load()}catch(e){alert(e.message)}}
async function endTrip(){if(!ekm.value||!ephoto.files[0])return alert('Closing odometer reading and photo are required.');const f=new FormData();f.set('allocation',allocation);f.set('action','end');f.set('odometer',ekm.value);f.set('photo',ephoto.files[0]);f.set('toll',toll.value);f.set('parking',parking.value);f.set('state_tax',tax.value);f.set('night_charge',night.value);f.set('other_amount',other.value);f.set('other_reason',reason.value);try{await api('/api/vendor-portal',{method:'POST',body:f});alert('Trip closure submitted for CWD review.');await load()}catch(e){alert(e.message)}}
load();
</script>
</body>
</html>
