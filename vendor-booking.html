<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CWD Vendor Booking</title><style>body{font-family:system-ui;background:#f8fafc;margin:0;color:#0f172a}.w{max-width:650px;margin:auto;padding:14px}.c{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;margin:12px 0}.h{background:#0f172a;color:#fff}.btn{width:100%;padding:15px;border:0;border-radius:13px;font-weight:800;font-size:16px;margin-top:10px}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.blue{background:#0f172a;color:#fff}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box;margin:5px 0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#64748b;font-size:13px}.hide{display:none}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="c h"><h2>CWD Vendor Booking</h2><div id="head">Loading secure booking…</div></div><div id="app"></div></div><script>
const q=new URLSearchParams(location.search),offer=q.get('offer'),allocation=q.get('allocation'),app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opt={}){const r=await fetch(path,opt),d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||'Request failed');return d}
async function load(){try{const d=await api('/api/vendor-portal?'+(offer?'offer='+encodeURIComponent(offer):'allocation='+encodeURIComponent(allocation)));document.getElementById('head').textContent=d.mode==='offer'?'Booking Offer':'Allocated Booking';if(d.mode==='offer')renderOffer(d.offer);else renderAllocation(d)}catch(e){app.innerHTML='<div class="c"><b>'+esc(e.message)+'</b></div>'}}
function renderOffer(o){app.innerHTML='<div class="c"><h3>'+esc(o.booking_id)+'</h3><p><b>Vehicle:</b> '+esc(o.vehicle)+'</p><p><b>Trip:</b> '+esc(o.trip_type)+'</p><p><b>Route:</b> '+esc(o.route)+'</p><p><b>Start:</b> '+esc(o.start_at||'—')+'</p><p><b>Final Drop:</b> '+esc(o.final_drop_at||'—')+'</p><p><b>Estimated/Billable KM:</b> '+esc(o.estimated_km)+'</p><h2>Estimated Vendor Payout: ₹'+Number(o.estimated_vendor_payout||0).toLocaleString('en-IN')+'</h2><p class="muted">Accepting only records your interest. CWD will manually allocate one accepted vendor. Customer private details are not shown at offer stage.</p><button class="btn green" onclick="respond(\'accepted\')">ACCEPT</button><button class="btn red" onclick="respond(\'declined\')">DECLINE</button></div>'}
async function respond(response){try{await api('/api/vendor-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'respond_offer',offer,response})});alert('Response saved: '+response);load()}catch(e){alert(e.message)}}
function renderAllocation(d){const b=d.booking,a=d.allocation,t=d.trip||{};const maps=x=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x||'');app.innerHTML='<div class="c"><h3>'+esc(b.booking_id)+'</h3><p><b>Customer:</b> '+esc(b.customer_name)+'</p><p><b>Mobile:</b> <a href="tel:'+esc(b.customer_mobile)+'">'+esc(b.customer_mobile)+'</a></p><p><b>Pickup:</b> '+esc(b.exact_pickup)+'</p><a href="'+maps(b.exact_pickup)+'" target="_blank">Open Pickup in Maps</a><p><b>Drop:</b> '+esc(b.exact_drop)+'</p><a href="'+maps(b.exact_drop)+'" target="_blank">Open Drop in Maps</a><p><b>Route:</b> '+esc(b.route)+'</p><p><b>Pickup:</b> '+esc(b.pickup_date_time)+'</p><p><b>Final Drop:</b> '+esc(b.final_drop_date_time)+'</p><p><b>Trip:</b> '+esc(b.trip_type)+' • '+esc(b.vehicle)+'</p></div>'+
'<div class="c"><h3>Vehicle & Driver for this booking</h3><input id="vn" placeholder="Vehicle number" value="'+esc(a.vehicle_number||'')+'"><input id="dn" placeholder="Driver name" value="'+esc(a.driver_name||'')+'"><input id="dm" inputmode="numeric" placeholder="Driver mobile" value="'+esc(a.driver_mobile||'')+'"><button class="btn blue" onclick="saveDriver()">Save Details</button></div>'+
(!t.started_at?'<div class="c"><h3>START TRIP</h3><p class="muted">Record at customer pickup. This cannot be silently edited later.</p><input id="skm" type="number" step="0.1" placeholder="Starting odometer" required><input id="sphoto" type="file" accept="image/*" capture="environment" required><button class="btn green" onclick="startTrip()">START TRIP</button></div>':'<div class="c"><b>Trip started:</b> '+esc(t.started_at)+'<br><b>Starting KM:</b> '+esc(t.starting_odometer)+'</div>')+
(t.started_at&&!t.ended_at?'<div class="c"><h3>END TRIP</h3><p class="muted">Record at final customer drop.</p><input id="ekm" type="number" step="0.1" placeholder="Closing odometer"><input id="ephoto" type="file" accept="image/*" capture="environment"><div class="row"><input id="toll" type="number" min="0" placeholder="Toll ₹"><input id="parking" type="number" min="0" placeholder="Parking ₹"><input id="tax" type="number" min="0" placeholder="State Tax ₹"><select id="night"><option value="no">Night Charge: NO</option><option value="yes">Night Charge: YES</option></select></div><input id="other" type="number" min="0" placeholder="Other ₹"><input id="reason" placeholder="Other charge reason"><button class="btn red" onclick="endTrip()">END TRIP</button></div>':'')+
(t.ended_at?'<div class="c"><h3>Trip closure submitted</h3><p>Trip KM: <b>'+esc(t.calculated_trip_km)+'</b></p><p>Status: <b>'+esc(t.review_status)+'</b></p><p class="muted">Submitted values are locked for vendor. CWD admin can review/correct/query.</p></div>':'')}
async function saveDriver(){try{await api('/api/vendor-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save_driver_vehicle',allocation,vehicle_number:vn.value,driver_name:dn.value,driver_mobile:dm.value})});alert('Saved');load()}catch(e){alert(e.message)}}
async function startTrip(){const f=new FormData();f.set('allocation',allocation);f.set('action','start');f.set('odometer',skm.value);if(sphoto.files[0])f.set('photo',sphoto.files[0]);try{await api('/api/vendor-portal',{method:'POST',body:f});alert('Trip started');load()}catch(e){alert(e.message)}}
async function endTrip(){const f=new FormData();f.set('allocation',allocation);f.set('action','end');f.set('odometer',ekm.value);if(ephoto.files[0])f.set('photo',ephoto.files[0]);f.set('toll',toll.value);f.set('parking',parking.value);f.set('state_tax',tax.value);f.set('night_charge',night.value);f.set('other_amount',other.value);f.set('other_reason',reason.value);try{await api('/api/vendor-portal',{method:'POST',body:f});alert('Trip closure submitted');load()}catch(e){alert(e.message)}}
load();</script></body></html>
