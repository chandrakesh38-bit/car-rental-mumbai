<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CWD Vendor Booking</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--navy:#0b1739;--navy2:#17336f;--blue:#1769e0;--green:#0f9f6e;--red:#dc2626;--muted:#64748b;--line:#e3e9f3;color:#0f172a;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbfdff,#f3f6fb);min-height:100vh}.wrap{max-width:680px;margin:auto;padding:14px 12px 40px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 14px}.brand-left{display:flex;align-items:center;gap:10px}.brand img{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:#fff}.brand-name{font-size:16px;font-weight:950;color:var(--navy);letter-spacing:-.02em}.brand-sub{font-size:10px;color:var(--muted);font-weight:700}.secure{font-size:10px;color:#166534;background:#ecfdf3;border:1px solid #bbf7d0;padding:7px 9px;border-radius:999px;font-weight:850}.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:22px;padding:20px;margin-bottom:13px;box-shadow:0 15px 34px rgba(11,23,57,.16)}.hero .eyebrow{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#f1d589;font-weight:900}.hero h1{font-size:23px;margin:5px 0 5px;letter-spacing:-.03em}.hero p{font-size:12px;color:#dbe6ff;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 8px 25px rgba(15,23,42,.05)}.booking-id{font-size:11px;font-weight:900;color:#45607d;background:#f4f7fb;border-radius:999px;padding:6px 9px;display:inline-block}.title{font-size:18px;font-weight:950;color:var(--navy);margin:10px 0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.item{border:1px solid #edf0f5;background:#fbfcfe;border-radius:13px;padding:11px}.item.wide{grid-column:1/-1}.item small{display:block;color:#7a8799;font-size:9px;text-transform:uppercase;font-weight:850;letter-spacing:.04em;margin-bottom:4px}.item b{font-size:12px;color:#17243e;line-height:1.4}.payout{background:linear-gradient(135deg,#edf8f4,#f7fffb);border:1px solid #cfeadd;border-radius:15px;padding:14px;margin-top:12px}.payout small{display:block;color:#527064;font-size:10px;font-weight:800}.payout strong{display:block;color:#087a55;font-size:25px;margin-top:2px;letter-spacing:-.03em}.rules{font-size:11px;color:#566274;line-height:1.55;margin:0;padding-left:18px}.notice{font-size:11px;color:#5b6677;background:#f8fafc;border-radius:12px;padding:11px;margin-top:12px;line-height:1.5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:13px;padding:14px;font-weight:950;font-size:14px;text-decoration:none;cursor:pointer;transition:transform .15s ease,opacity .15s ease,filter .15s ease,box-shadow .15s ease}.btn:active{transform:scale(.97);filter:brightness(.82)}.btn:disabled{opacity:.82;cursor:wait}.tap-flash{filter:brightness(.82)!important;box-shadow:0 0 0 4px rgba(23,105,224,.18)!important;transform:scale(.985)!important}.btn-success{background:#15803d!important;color:#fff!important;border-color:#15803d!important}.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.accept{background:#0f9f6e;color:white}.decline{background:#fff0f1;color:#c0222f;border:1px solid #ffd4d8}.primary{background:linear-gradient(135deg,var(--navy),#1b3d80);color:white}.secondary{background:#fff;border:1px solid #d7dfea;color:var(--navy)}.success{background:#ecfdf3;border:1px solid #bbf7d0;color:#166534;border-radius:15px;padding:16px;text-align:center}.declined{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:15px;padding:16px;text-align:center}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:850;color:#25324d;margin-bottom:6px}input,select{width:100%;border:1px solid #d4ddea;border-radius:12px;padding:12px 13px;font:inherit;background:#fff;outline:none}input:focus,select:focus{border-color:#6f91d5;box-shadow:0 0 0 3px rgba(23,105,224,.1)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.maps{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;font-weight:850;color:#1769e0;text-decoration:none}.trip-state{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:850;color:#38506d}.dot{width:8px;height:8px;border-radius:50%;background:#16a34a}.muted{color:var(--muted);font-size:11px;line-height:1.5}.locked{font-size:10px;color:#7a8799;background:#f8fafc;border-radius:10px;padding:9px;margin-top:10px}.error{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;border-radius:15px;padding:14px;font-weight:800}@media(max-width:520px){.summary,.row{grid-template-columns:1fr}.item.wide{grid-column:auto}.actions{grid-template-columns:1fr}.secure{display:none}.wrap{padding:10px 10px 32px}.hero{border-radius:19px}.card{border-radius:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-left"><img src="/logo-optimized.webp" alt="Car With Driver India"><div><div class="brand-name">Car With Driver India</div><div class="brand-sub">Vendor Operations</div></div></div>
    <div class="secure">Secure Link</div>
  </div>
  <div class="hero"><div class="eyebrow" id="hero-eyebrow">Vendor Booking</div><h1 id="hero-title">Loading…</h1><p id="hero-sub">Please wait while we open your secure booking link.</p></div>
  <div id="app"></div>
</div>
<script>
const q=new URLSearchParams(location.search),offer=q.get('offer'),allocation=q.get('allocation'),app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const dt=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true}).format(d)};
async function api(path,opt={}){const r=await fetch(path,opt),d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||'Request failed');return d}
function busyButton(btn,label){
 if(!btn)return()=>{};
 const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span>'+label;
 return()=>{btn.disabled=false;btn.innerHTML=old};
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function successButton(btn,label){
 if(!btn)return;
 btn.disabled=true;btn.classList.add('btn-success');btn.innerHTML='✓ '+label;
 await wait(420);
}
function setHero(title,sub,eyebrow){document.getElementById('hero-title').textContent=title;document.getElementById('hero-sub').textContent=sub;document.getElementById('hero-eyebrow').textContent=eyebrow}
async function load(){try{if(!offer&&!allocation)throw new Error('Secure booking token is missing.');const d=await api('/api/vendor-portal?'+(offer?'offer='+encodeURIComponent(offer):'allocation='+encodeURIComponent(allocation)));if(d.mode==='offer')renderOffer(d.offer);else renderAllocation(d)}catch(e){setHero('Unable to open booking','This link may be invalid, expired or revoked.','Secure Link');app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function renderOffer(o){
 setHero('Booking Offer','Review the trip details and respond below. Customer private details are hidden until allocation.','CWD Vendor Offer');
 if(o.status==='accepted'){app.innerHTML='<div class="success"><b>✓ Offer Accepted</b><br><span class="muted">Your response is recorded. This booking is not allocated yet. CWD will contact you if you are selected.</span></div>'+offerSummary(o);return}
 if(o.status==='declined'){app.innerHTML='<div class="declined"><b>Offer Declined</b><br><span class="muted">Your response has been recorded.</span></div>'+offerSummary(o);return}
 if(o.status==='allocated'){app.innerHTML='<div class="success"><b>✓ Booking Allocated</b><br><span class="muted">Please use the separate allocation link shared by CWD to view customer details and operate the trip.</span></div>'+offerSummary(o);return}
 app.innerHTML=offerSummary(o)+'<div class="card"><div class="title">Your Response</div><div class="notice">Accepting this offer only confirms your availability. It does <b>not</b> allocate the booking. CWD may receive acceptance from multiple vendors and will manually allocate one vendor.</div><div class="actions"><button class="btn accept" onclick="respond(\'accepted\',this)">✓ ACCEPT OFFER</button><button class="btn decline" onclick="respond(\'declined\',this)">DECLINE</button></div></div>';
}
function offerSummary(o){
 const p=o.pricing_snapshot||{};
 const rate=Number(p.vendor_km_rate||0),da=Number(p.vendor_da||0);
 const night=Number(p.vendor_night||0),local=/local/i.test(o.trip_type||'');
 const kmDay=Number(p.minimum_km_per_day||200);
 const packageName=String(p.local_package||'As booked').replaceAll('_',' / ');
 const rules=local?
   '<li>Package: '+esc(packageName)+'</li><li>Extra KM: '+money(rate)+'/KM; extra hours as quoted.</li>':
   '<li>Minimum: '+esc(kmDay)+' KM/day.</li><li>Regular & extra KM: '+money(rate)+'/KM.</li>'+
   '<li>Driver allowance: '+money(da)+'/day.</li>';
 return '<div class="card"><span class="booking-id">'+esc(o.booking_id)+'</span>'+
   '<div class="title">Booking Summary</div><div class="summary">'+
   '<div class="item"><small>Car</small><b>'+esc(o.vehicle||'As requested')+'</b></div>'+
   '<div class="item"><small>Trip Type</small><b>'+esc(o.trip_type||'—')+'</b></div>'+
   '<div class="item wide"><small>Route</small><b>'+esc(o.route||'—')+'</b></div>'+
   '<div class="item"><small>Pickup</small><b>'+esc(dt(o.start_at))+'</b></div>'+
   '<div class="item"><small>Final Drop</small><b>'+esc(dt(o.final_drop_at))+'</b></div>'+
   '<div class="item"><small>Total KM</small><b>'+esc(o.estimated_km||0)+' KM</b></div>'+
   '<div class="item"><small>Days</small><b>'+esc(p.duty_days||1)+'</b></div>'+
   '</div><div class="payout"><small>Aapko milega</small><strong>'+money(o.estimated_vendor_payout)+'</strong></div>'+
   '<div class="title" style="font-size:14px;margin-top:15px">Payment Details</div>'+
   '<ul class="rules">'+rules+
   '<li>Night: '+money(night)+' if pickup or final drop is between 10:01 PM–5:59 AM.</li>'+
   '<li>Toll, parking and state tax extra at actuals.</li></ul></div>';
}
async function respond(response,btn){if(!confirm(response==='accepted'?'Confirm that you are available for this booking?':'Decline this booking offer?'))return;const done=busyButton(btn,response==='accepted'?'ACCEPTING…':'DECLINING…');try{await api('/api/vendor-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'respond_offer',offer,response})});await successButton(btn,response==='accepted'?'OFFER ACCEPTED':'DECLINED');await load()}catch(e){alert(e.message);done()}}
function renderAllocation(d){
 const b=d.booking,a=d.allocation,t=d.trip||{};setHero('Allocated Booking','This booking has been allocated to you. Customer details are now available.','CWD Vendor Trip');
 const maps=x=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x||'');
 app.innerHTML='<div class="card"><span class="booking-id">'+esc(b.booking_id)+'</span><div class="title">Customer & Trip Details</div><div class="summary"><div class="item"><small>Customer</small><b>'+esc(b.customer_name||'—')+'</b></div><div class="item"><small>Mobile</small><b><a href="tel:'+esc(b.customer_mobile)+'" style="color:#1769e0;text-decoration:none">'+esc(b.customer_mobile||'—')+'</a></b></div><div class="item wide"><small>Pickup Location</small><b>'+esc(b.exact_pickup||'—')+'</b><br><a class="maps" target="_blank" href="'+maps(b.exact_pickup)+'">Open pickup in Google Maps →</a></div><div class="item wide"><small>Destination</small><b>'+esc(b.destination||'—')+'</b><br><a class="maps" target="_blank" href="'+maps(b.destination||b.exact_drop)+'">Open destination in Google Maps →</a></div>'+(b.exact_drop&&b.destination&&b.exact_drop!==b.destination?'<div class="item wide"><small>Final Customer Drop</small><b>'+esc(b.exact_drop)+'</b><br><a class="maps" target="_blank" href="'+maps(b.exact_drop)+'">Open final drop in Google Maps →</a></div>':'')+'<div class="item"><small>Pickup Date / Time</small><b>'+esc(dt(b.pickup_date_time))+'</b></div><div class="item"><small>Final Drop</small><b>'+esc(dt(b.final_drop_date_time))+'</b></div><div class="item"><small>Trip Type</small><b>'+esc(b.trip_type||'—')+'</b></div><div class="item"><small>Vehicle</small><b>'+esc(b.vehicle||'—')+'</b></div></div></div>'+
 (t.ended_at?'<div class="card"><div class="title">Vehicle & Driver</div><div class="summary"><div class="item"><small>Vehicle Number</small><b>'+esc(a.vehicle_number||'—')+'</b></div><div class="item"><small>Driver</small><b>'+esc(a.driver_name||'—')+'</b></div><div class="item wide"><small>Driver Mobile</small><b>'+esc(a.driver_mobile||'—')+'</b></div></div><div class="locked">Trip is closed. Vehicle and driver details are locked. Contact CWD for any correction.</div></div>':'<div class="card"><div class="title">Vehicle & Driver</div><p class="muted" style="margin-top:-4px;margin-bottom:12px">Enter the actual vehicle and driver reporting for this trip. These details can be updated until the trip is closed.</p><div class="field"><label>Vehicle number</label><input id="vn" autocapitalize="characters" spellcheck="false" placeholder="e.g. MH01AB1234" value="'+esc(a.vehicle_number||'')+'"></div><div class="field"><label>Driver name</label><input id="dn" autocomplete="name" placeholder="Driver full name" value="'+esc(a.driver_name||'')+'"></div><div class="field"><label>Driver mobile</label><input id="dm" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="10-digit mobile" value="'+esc(a.driver_mobile||'')+'"></div><button class="btn primary" onclick="saveDriver(this)">Save Vehicle & Driver</button></div>')+
 (!t.started_at?(a.start_allowed&&a.driver_details_ready?'<div class="card"><div class="trip-state"><span class="dot"></span>Ready to start</div><div class="title">Start Trip</div><p class="muted">At customer pickup, upload the odometer photo and enter the starting reading. Submitted start details are locked for vendor.</p><div class="field"><label>Starting odometer reading *</label><input id="skm" type="number" min="0" step="0.1" placeholder="Enter KM"></div><div class="field"><label>Starting odometer photo *</label><input id="sphoto" type="file" accept="image/*" capture="environment"></div>'+(a.early_start_approved_at?'<div class="success" style="margin-bottom:10px;padding:10px"><b>✓ Early Start Approved by CWD</b></div>':'<div class="notice">Trip Start is normally available only within 3 hours of pickup time. CWD admin can approve an earlier start when required.</div>')+'<button class="btn accept" onclick="startTrip(this)">START TRIP</button></div>':'<div class="card"><div class="title">Start Trip</div><div class="notice">'+(a.driver_details_ready?'Start allowed 3 hours before pickup ('+dt(a.can_start_at)+').':'Save driver details first.')+'</div></div>'):'<div class="card"><div class="trip-state"><span class="dot"></span>Trip started</div><div class="summary"><div class="item"><small>Started At</small><b>'+esc(dt(t.started_at))+'</b></div><div class="item"><small>Starting KM</small><b>'+esc(t.starting_odometer)+'</b></div></div><div class="locked">Starting odometer details are locked. Only CWD admin can correct them.</div></div>')+
 (t.started_at&&!t.ended_at?'<div class="card"><div class="title">End Trip</div><p class="muted">Submit these details at final customer drop.</p><div class="field"><label>Closing odometer reading *</label><input id="ekm" type="number" min="0" step="0.1" placeholder="Enter KM"></div><div class="field"><label>Closing odometer photo *</label><input id="ephoto" type="file" accept="image/*" capture="environment"></div><div class="row"><div class="field"><label>Toll ₹</label><input id="toll" type="number" min="0" value="0"></div><div class="field"><label>Parking ₹</label><input id="parking" type="number" min="0" value="0"></div><div class="field"><label>State Tax ₹</label><input id="tax" type="number" min="0" value="0"></div></div><div class="field"><label>Other ₹</label><input id="other" type="number" min="0" value="0"></div><div class="field"><label>Other charge reason</label><input id="reason" placeholder="Required only if Other charge is entered"></div><button class="btn primary" onclick="endTrip(this)">END TRIP & SUBMIT</button></div>':'')+
 (t.ended_at?'<div class="card"><div class="success"><b>✓ Trip Closure Submitted</b><br><span class="muted">CWD admin review is required.</span></div><div class="summary"><div class="item"><small>Trip KM</small><b>'+esc(t.calculated_trip_km)+'</b></div><div class="item"><small>Review Status</small><b>'+esc(String(t.review_status||'').replaceAll('_',' '))+'</b></div></div><div class="locked">Submitted closing details are locked. CWD admin can review, correct or query the submission.</div></div>':'');
}
async function saveDriver(btn){const done=busyButton(btn,'SAVING…');try{await api('/api/vendor-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save_driver_vehicle',allocation,vehicle_number:vn.value,driver_name:dn.value,driver_mobile:dm.value})});await successButton(btn,'SAVED');await load()}catch(e){alert(e.message);done()}}
async function startTrip(btn){if(!skm.value||!sphoto.files[0])return alert('Starting odometer reading and photo are required.');const done=busyButton(btn,'STARTING…');const f=new FormData();f.set('allocation',allocation);f.set('action','start');f.set('odometer',skm.value);f.set('photo',sphoto.files[0]);try{await api('/api/vendor-portal',{method:'POST',body:f});await successButton(btn,'TRIP STARTED');await load()}catch(e){alert(e.message);done()}}
async function endTrip(btn){if(!ekm.value||!ephoto.files[0])return alert('Closing odometer reading and photo are required.');if(!confirm('Submit final trip closure? These details will be locked after submission.'))return;const done=busyButton(btn,'SUBMITTING…');const f=new FormData();f.set('allocation',allocation);f.set('action','end');f.set('odometer',ekm.value);f.set('photo',ephoto.files[0]);f.set('toll',toll.value);f.set('parking',parking.value);f.set('state_tax',tax.value);f.set('other_amount',other.value);f.set('other_reason',reason.value);try{await api('/api/vendor-portal',{method:'POST',body:f});await successButton(btn,'TRIP CLOSED');await load()}catch(e){alert(e.message);done()}}
document.addEventListener('click',e=>{
 const el=e.target.closest('.btn,.maps');
 if(!el||el.disabled)return;
 el.classList.add('tap-flash');
 setTimeout(()=>el.classList.remove('tap-flash'),260);
});
load();
</script>
</body>
</html>
